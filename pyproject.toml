[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90.0

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E402", "S101", "S104", "S108", "S110", "S112", "S311", "S404", "S603", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]
