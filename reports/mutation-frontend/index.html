key: `${i}A`, ring: 'A', start, end })\n  }\n\n  return (\n    <"+">\n      <"+"div className=\"hint\">\n        Der laufende Track ist <"+"strong>blau<"+"/strong>, harmonisch kompatible Nachbarn sind{' '}\n        <"+"strong>hell markiert<"+"/strong>. Klick = genau dieser Key. Strg-Klick = mehrere Keys.\n      <"+"/div>\n      <"+"div className=\"wheelwrap\">\n        <"+"svg className=\"wheel\" viewBox=\"0 0 320 320\" role=\"group\" aria-label=\"Interaktives Camelot Wheel\">\n          {segments.map(({ key, ring, start, end }) => {\n            const isSelected = selectedKeys.includes(key)\n            const isCurrent = key === referenceKey\n            const isCompat = compatible.includes(key)\n            const r1 = ring === 'A' ? 70 : 114\n            const r2 = ring === 'A' ? 113 : 151\n            const [cx, cy] = pt(160, 160, ring === 'A' ? 91 : 132, start + 15)\n            const fill = isCurrent\n              ? '#276eb8'\n              : isSelected\n                ? '#315d83'\n                : isCompat\n                  ? '#344b60'\n                  : ring === 'A'\n                    ? '#272e37'\n                    : '#222831'\n            const stroke = isCurrent ? '#99c7ff' : isSelected ? '#618cb5' : '#4a535d'\n\n            return (\n              <"+"g\n                key={key}\n                role=\"button\"\n                tabIndex={0}\n                className=\"region\"\n                data-wheel-key={key}\n                aria-label={`${key}${isCurrent ? ', aktuell' : ''}${isCompat ? ', harmonisch kompatibel' : ''}${isSelected ? ', als Filter gewählt' : ''}`}\n                onClick={(event) => onToggleKey(key, event.ctrlKey || event.shiftKey || event.metaKey)}\n                onKeyDown={(event) => {\n                  if (event.key === 'Enter' || event.key === ' ') {\n                    event.preventDefault()\n                    onToggleKey(key, event.ctrlKey || event.shiftKey || event.metaKey)\n                  }\n                }}\n              >\n                <"+"title>\n                  {`${key}${isCurrent ? ' · Aktuelle Referenz' : isCompat ? ' · Harmonisch kompatibel' : ''}${isSelected ? ' · Aktiv im Filter' : ''} – Klick: nur diesen Key · Strg+Klick: mehrfach wählen`}\n                <"+"/title>\n                <"+"path\n                  d={pathWedge(r1, r2, start + 0.35, end - 0.35)}\n                  stroke={stroke}\n                  strokeWidth={isCurrent ? 2 : 1}\n                  fill={fill}\n                />\n                <"+"text x={cx} y={cy} className={isCurrent ? 'activekey' : undefined}>\n                  {key}\n                <"+"/text>\n              <"+"/g>\n            )\n          })}\n          <"+"circle cx={160} cy={160} r={67} className=\"wheelcenter\" />\n          <"+"text x={160} y={155} textAnchor=\"middle\" className=\"wheelcentertext\">\n            {referenceKey}\n          <"+"/text>\n          <"+"text x={160} y={174} textAnchor=\"middle\" className=\"wheeldesc\">\n            {pinned ? 'Fixierte Referenz' : 'Live-Referenz'}\n          <"+"/text>\n        <"+"/svg>\n      <"+"/div>\n      <"+"div className=\"kicker\">Schnellwahl für aktuellen Track<"+"/div>\n      <"+"div className=\"keychooser\">\n        {compatible.map((key) => (\n          <"+"button\n            key={key}\n            type=\"button\"\n            className={`keychip ${selectedKeys.includes(key) ? 'active' : ''} ${key === referenceKey ? 'current' : ''}`}\n            data-key={key}\n            title={`${key} ${key === referenceKey ? '(aktuelle Tonart)' : '(harmonischer Nachbar)'} – Klick: einzeln · Strg+Klick: hinzufügen/abwählen`}\n            onClick={(event) => onToggleKey(key, event.ctrlKey || event.shiftKey || event.metaKey)}\n          >\n            {key}\n          <"+"/button>\n        ))}\n      <"+"/div>\n      <"+"button\n        type=\"button\"\n        id=\"allHarmonic\"\n        className=\"w100 sm\"\n        style={{ marginTop: 7 }}\n        title=\"Wählt alle 4 harmonisch passenden Camelot-Keys (-1, Referenz, +1 sowie A/B-Wechsel)\"\n        onClick={onSelectAllHarmonic}\n      >\n        Alle harmonisch passenden Keys wählen\n      <"+"/button>\n      <"+"div className=\"note\" id=\"wheelNotice\">\n        {selectedKeys.length ? `Aktive Keys: ${selectedKeys.join(', ')}` : 'Keine Keys gewählt – klicke ein Segment'}\n      <"+"/div>\n      <"+"div className=\"sep\" />\n      <"+"label\n        className=\"checkrow\"\n        title=\"Passt die gewählten kompatiblen Keys automatisch an, sobald ein neuer Track auf dem aktiven Deck läuft\"\n      >\n        <"+"input\n          type=\"checkbox\"\n          id=\"autoFollow\"\n          checked={autoFollow}\n          onChange={(event) => onAutoFollowChange(event.target.checked)}\n        />\n        Bei Trackwechsel automatisch folgen\n      <"+"/label>\n      <"+"label\n        className=\"checkrow\"\n        title=\"Bezieht die exakt gleiche Tonart des Referenztracks zusätzlich zu den Nachbar-Keys ein\"\n      >\n        <"+"input\n          type=\"checkbox\"\n          id=\"includeCurrent\"\n          checked={includeCurrent}\n          onChange={(event) => onIncludeCurrentChange(event.target.checked)}\n        />\n        Aktuellen Key einschließen\n      <"+"/label>\n      <"+"div className=\"navhint\">\n        Klick auf ein Wheel-Segment = nur dieser Key. Mit Strg-Klick mehrere Keys kombinieren. „Alle harmonischen Keys“ setzt die ganze Auswahl. Der Live-Modus nutzt zusätzlich deine BPM- und Genre-Vorgaben.\n      <"+"/div>\n    <"+"/>\n  )\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":97,"low":95,"break":95},"testFiles":{"tests/frontend/views-table.test.tsx":{"tests":[{"id":"0","name":"TrackTable > renders rows, handles sorting, selection, header & row context menus, column picker and keyboard navigation","location":{"start":{"column":3,"line":71}}},{"id":"1","name":"live-view.tsx > maps liveSortToCascade and exercises all LiveView controls, filters, sort headers and inspector","location":{"start":{"column":3,"line":220}}},{"id":"2","name":"filter-view.tsx > exercises presets, rule groups, search, sort designer stages, queue pane and inspector","location":{"start":{"column":3,"line":515}}},{"id":"3","name":"set-view.tsx & hardware-modal.tsx > renders SetView transitions, reordering buttons, drag-and-drop and empty state","location":{"start":{"column":3,"line":765}}},{"id":"4","name":"set-view.tsx & hardware-modal.tsx > renders HardwareModal decks, network controls, USB binding and status variants","location":{"start":{"column":3,"line":839}}}],"source":"import { fireEvent, render, screen, within } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\nimport { type LiveStatus, type Results, type Track } from '../../src/api'\nimport { FilterView } from '../../src/filter-view'\nimport { HardwareModal } from '../../src/hardware-modal'\nimport { LiveView, liveSortToCascade } from '../../src/live-view'\nimport { builtInPresets, defaultColumns, type MetadataId, type RuleGroup } from '../../src/metadata'\nimport { SetView } from '../../src/set-view'\nimport { TrackTable } from '../../src/track-table'\n\nconst sampleTracks: Track[] = [\n  {\n    id: 't1',\n    title: 'Midnight Pulse',\n    artist: 'Klangwerk',\n    genre: 'Techno',\n    bpm: 138,\n    key: '8A',\n    rating: 5,\n    seconds: 340,\n    year: 2024,\n    album: 'Vault 1',\n    label: 'Rhythm',\n    comment: 'Peak hour',\n    plays: 1,\n    bitrate: 320,\n    path: 'E:/Music/midnight.mp3',\n    added: '2025-01-10',\n    created: '2024-05-01',\n    sample_rate: 44100,\n    bytes: 12000000,\n  },\n  {\n    id: 't2',\n    title: 'Solar Drift',\n    artist: 'Noire',\n    genre: 'Hardgroove',\n    bpm: 139,\n    key: '9A',\n    rating: 4,\n    seconds: 310,\n    year: 2023,\n    plays: 0,\n  },\n  {\n    id: 't3',\n    title: '',\n    artist: '',\n    genre: '',\n    bpm: null,\n    key: null,\n    rating: 0,\n    seconds: null,\n    year: null,\n  },\n]\n\nconst sampleResults: Results = {\n  rows: sampleTracks,\n  counts: [1, 1, 1, 0],\n  genres: [\n    { value: 'Techno', count: 10 },\n    { value: 'Hardgroove', count: 5 },\n  ],\n  keys: [{ value: '8A', count: 8 }],\n  histogram: [{ bpm: 138, count: 12 }],\n  ms: 4.2,\n}\n\ndescribe('TrackTable', () => {\n  it('renders rows, handles sorting, selection, header & row context menus, column picker and keyboard navigation', () => {\n    const onSort = vi.fn()\n    const onSelect = vi.fn()\n    const onVisible = vi.fn()\n    const onAddToSet = vi.fn()\n    const onPinReference = vi.fn()\n    const onFindRekordbox = vi.fn()\n    const onRekordboxAction = vi.fn()\n    const onEmptyAction = vi.fn()\n\n    const { container, rerender } = render(\n      <"+"TrackTable\n        data={sampleTracks}\n        sorting={[{ id: 'bpm', desc: false }]}\n        onSort={onSort}\n        selected=\"t1\"\n        onSelect={onSelect}\n        busy={false}\n        revision=\"1\"\n        visible={defaultColumns}\n        onVisible={onVisible}\n        reference=\"8A\"\n        setIds={new Set(['t1'])}\n        onAddToSet={onAddToSet}\n        onPinReference={onPinReference}\n        onFindRekordbox={onFindRekordbox}\n        onRekordboxAction={onRekordboxAction}\n      />,\n    )\n\n    expect(screen.getByText('Midnight Pulse')).toBeInTheDocument()\n    expect(screen.getByText('Ohne Titel')).toBeInTheDocument()\n\n    // Click row selects track\n    fireEvent.click(container.querySelector('.track-row[data-track-id=\"t2\"]')!)\n    expect(onSelect).toHaveBeenCalledWith(sampleTracks[1])\n\n    // Click + Set stops propagation & adds\n    fireEvent.click(screen.getAllByRole('button', { name: '+ Set' })[0])\n    expect(onAddToSet).toHaveBeenCalledWith(sampleTracks[1])\n\n    // Sort header toggle\n    fireEvent.click(screen.getByText('BPM'))\n    expect(onSort).toHaveBeenCalled()\n\n    // Header right-click -> column picker context menu\n    const headerRow = container.querySelector('.track-header')!\n    fireEvent.contextMenu(headerRow, { clientX: 40, clientY: 50 })\n    const albumCheckbox = screen.getByLabelText('Album')\n    fireEvent.click(albumCheckbox)\n    expect(onVisible).toHaveBeenCalledWith([...defaultColumns, 'album'])\n    const genreCheckbox = screen.getByLabelText('Genre')\n    fireEvent.click(genreCheckbox)\n    expect(onVisible).toHaveBeenCalledWith(defaultColumns.filter((c) => c !== 'genre'))\n    fireEvent.click(screen.getByRole('button', { name: 'Standardlayout' }))\n    expect(onVisible).toHaveBeenCalledWith(defaultColumns)\n    fireEvent.keyDown(window, { key: 'Escape' })\n\n    // Row right-click context menu: pin, rekordbox transport actions, add, details, and backdrop close\n    const row2 = container.querySelector('.track-row[data-track-id=\"t2\"]')!\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /Als Referenz setzen/i }))\n    expect(onPinReference).toHaveBeenCalledWith(sampleTracks[1])\n\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /In Rekordbox anzeigen/i }))\n    expect(onRekordboxAction).toHaveBeenCalledWith(sampleTracks[1], 'reveal')\n\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /In Deck A laden/i }))\n    expect(onRekordboxAction).toHaveBeenCalledWith(sampleTracks[1], 'deck1')\n\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /In Deck B laden/i }))\n    expect(onRekordboxAction).toHaveBeenCalledWith(sampleTracks[1], 'deck2')\n\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /Zum Set hinzufügen/i }))\n    expect(onAddToSet).toHaveBeenCalledWith(sampleTracks[1])\n\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /Details \\/ Explorer/i }))\n    expect(onFindRekordbox).toHaveBeenCalledWith(sampleTracks[1])\n\n    // Close context menu via backdrop\n    fireEvent.contextMenu(row2, { clientX: 50, clientY: 60 })\n    fireEvent.pointerDown(container.querySelector('.context-menu')!)\n    fireEvent.pointerDown(container.querySelector('.context-backdrop')!)\n    expect(container.querySelector('.context-menu')).toBeNull()\n\n    // Keyboard navigation on table\n    const grid = container.querySelector('.tablebox')!\n    fireEvent.keyDown(grid, { key: 'Enter' })\n    fireEvent.keyDown(grid, { key: 'ArrowDown' })\n    fireEvent.keyDown(grid, { key: 'ArrowUp' })\n    fireEvent.keyDown(grid, { key: 'Home' })\n    fireEvent.keyDown(grid, { key: 'End' })\n\n    // Without onRekordboxAction, \"In Rekordbox anzeigen\" falls back to onFindRekordbox\n    rerender(\n      <"+"TrackTable\n        data={sampleTracks}\n        sorting={[]}\n        onSort={onSort}\n        selected={null}\n        onSelect={onSelect}\n        busy={false}\n        revision=\"1b\"\n        visible={defaultColumns}\n        onVisible={onVisible}\n        reference={null}\n        setIds={new Set()}\n        onAddToSet={onAddToSet}\n        onPinReference={onPinReference}\n        onFindRekordbox={onFindRekordbox}\n      />,\n    )\n    fireEvent.contextMenu(container.querySelector('.track-row[data-track-id=\"t1\"]')!, { clientX: 50, clientY: 60 })\n    fireEvent.click(screen.getByRole('button', { name: /In Rekordbox anzeigen/i }))\n    expect(onFindRekordbox).toHaveBeenCalledWith(sampleTracks[0])\n\n    // Empty state + empty action button\n    rerender(\n      <"+"TrackTable\n        data={[]}\n        sorting={[]}\n        onSort={onSort}\n        selected={null}\n        onSelect={onSelect}\n        busy={false}\n        revision=\"2\"\n        visible={defaultColumns}\n        onVisible={onVisible}\n        reference={null}\n        setIds={new Set()}\n        onAddToSet={onAddToSet}\n        onPinReference={onPinReference}\n        onFindRekordbox={onFindRekordbox}\n        emptyTitle=\"Nichts gefunden\"\n        emptyActionLabel=\"Alle Keys zeigen\"\n        onEmptyAction={onEmptyAction}\n      />,\n    )\n    fireEvent.click(screen.getByRole('button', { name: 'Alle Keys zeigen' }))\n    expect(onEmptyAction).toHaveBeenCalledTimes(1)\n  })\n})\n\ndescribe('live-view.tsx', () => {\n  it('maps liveSortToCascade and exercises all LiveView controls, filters, sort headers and inspector', () => {\n    expect(liveSortToCascade('bpmasc')[0]).toEqual({ id: 'bpm', desc: false })\n    expect(liveSortToCascade('bpmdesc')[0]).toEqual({ id: 'bpm', desc: true })\n    expect(liveSortToCascade('rating')[0]).toEqual({ id: 'rating', desc: true })\n    expect(liveSortToCascade('yearnew')[0]).toEqual({ id: 'year', desc: true })\n    expect(liveSortToCascade('yearold')[0]).toEqual({ id: 'year', desc: false })\n    expect(liveSortToCascade('artist')[0]).toEqual({ id: 'artist', desc: false })\n    expect(liveSortToCascade('key')[0]).toEqual({ id: 'key', desc: false })\n    expect(liveSortToCascade('playcount')[0]).toEqual({ id: 'plays', desc: false })\n    expect(liveSortToCascade('title')[0]).toEqual({ id: 'title', desc: false })\n    expect(liveSortToCascade('genre')[0]).toEqual({ id: 'genre', desc: false })\n\n    const onSearchChange = vi.fn()\n    const onSortCodeChange = vi.fn()\n    const onUseBpmChange = vi.fn()\n    const onToleranceChange = vi.fn()\n    const onSameGenreChange = vi.fn()\n    const onUnplayedOnlyChange = vi.fn()\n    const onMinRatingChange = vi.fn()\n    const onOpenHardware = vi.fn()\n    const onGoFilterStudio = vi.fn()\n    const onGoSetBuilder = vi.fn()\n    const onAddToSet = vi.fn()\n    const onFindRekordbox = vi.fn()\n    const onRekordboxAction = vi.fn()\n\n    const { container, rerender } = render(\n      <"+"LiveView\n        active\n        liveTrack={{\n          deck: 2,\n          name: 'rekordbox',\n          sourc dles source menu switching, help modal, hardware modal actions and window controls","location":{"start":{"column":3,"line":501}}},{"id":"9","name":"App (main.tsx) > handles Rekordbox transport ok:false, transport error and missing/failing revealFile with clipboard fallback","location":{"start":{"column":3,"line":557}}},{"id":"10","name":"App (main.tsx) > covers error branches, canceled pickers, live status variants, localStorage and null track fields","location":{"start":{"column":3,"line":618}}},{"id":"11","name":"App (main.tsx) > falls back cleanly when localStorage holds non-array values or empty columns","location":{"start":{"column":3,"line":801}}},{"id":"12","name":"App (main.tsx) > displays and updates the top-left viewport size overlay on resize","location":{"start":{"column":3,"line":811}}}],"source":"import { fireEvent, render, screen, waitFor, within } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\nimport { App } from '../../src/main'\n\nfunction makeMockBridge(overrides?: {\n  liveResponses?: unknown[]\n  openFailsOnce?: boolean\n  transportOk?: boolean\n  revealOk?: boolean\n  omitReveal?: boolean\n}) {\n  const tracks = [\n    {\n      id: 't1',\n      title: 'Acid Horizon',\n      artist: 'Klara',\n      genre: 'Techno',\n      bpm: 138,\n      key: '8A',\n      rating: 5,\n      seconds: 320,\n      year: 2024,\n      path: 'E:/Music/acid.mp3',\n    },\n    {\n      id: 't2',\n      title: 'Velvet Bass',\n      artist: 'Mika',\n      genre: 'Hardgroove',\n      bpm: 139,\n      key: '9A',\n      rating: 4,\n      seconds: 300,\n      year: 2023,\n    },\n  ]\n\n  let liveCall = 0\n  let openFailed = false\n  const liveQueue = overrides?.liveResponses ?? [\n    {\n      state: 'rekordbox',\n      error: null,\n      anchor: 2,\n      matches: [],\n      media: [{\n        source: 1,\n        slot: 3,\n        path: 'E:/USB/exportLibrary.db',\n        kind: 'OneLibrary',\n        total: 10,\n        genres: 2,\n        bpmBounds: [125, 140],\n        withKey: 9,\n      }],\n      decks: [\n        {\n          deck: 1,\n          name: 'rekordbox',\n          source: 0,\n          slot: 0,\n          slotName: 'Rekordbox lokal',\n          trackId: 't1',\n          bpm: 128,\n          key: '7A',\n          title: 'Deck One Silent',\n          artist: 'Silent DJ',\n          libraryId: null,\n          playing: true,\n          master: false,\n          fader: 0,\n        },\n        {\n          deck: 2,\n          name: 'rekordbox',\n          source: 0,\n          slot: 0,\n          slotName: 'Rekordbox lokal',\n          trackId: 't2',\n          bpm: 138,\n          key: '9A',\n          title: 'Deck Two Live',\n          artist: 'Live DJ',\n          libraryId: 't2',\n          playing: true,\n          master: true,\n          fader: 1,\n        },\n      ],\n    },\n  ]\n\n  const reqSpy = vi.fn(async (method: string, _params?: object) => {\n    if (method === 'open' || method === 'openPath') {\n      if (overrides?.openFailsOnce && !openFailed) {\n        openFailed = true\n        throw new Error(\"Error invoking remote method 'cuepoint:request': Error: Laufwerk E nicht gefunden\")\n      }\n      return {\n        path: (_params as { path?: string } | undefined)?.path ?? 'E:/PIONEER/Master/master.db',\n        kind: 'Master',\n        total: 15500,\n        genres: 12,\n        bpmBounds: [115, 145],\n        withKey: 15000,\n      }\n    }\n    if (method === 'bindMedia') {\n      return {\n        source: 1,\n        slot: 3,\n        path: 'E:/USB/exportLibrary.db',\n        kind: 'OneLibrary',\n        total: 10,\n        genres: 2,\n        bpmBounds: [125, 140],\n        withKey: 9,\n      }\n    }\n    if (method === 'demoLibrary') {\n      return {\n        path: null,\n        kind: 'Demo',\n        total: 2,\n        genres: 2,\n        bpmBounds: [120, 140],\n        withKey: 2,\n      }\n    }\n    if (method === 'interfaces') return [{ name: 'LAN', ip: '192.168.1.2' }]\n    if (method === 'usb') return ['F:/PIONEER/exportLibrary.db']\n    if (method === 'live') {\n      const idx = Math.min(liveCall, liveQueue.length - 1)\n      liveCall += 1\n      return liveQueue[idx]\n    }\n    if (method === 'query') {\n      return {\n        rows: tracks,\n        counts: [1, 1, 1, 0],\n        genres: [{ value: 'Techno', count: 1 }],\n        keys: [{ value: '8A', count: 1 }],\n        histogram: [{ bpm: 138, count: 1 }],\n        ms: 3.1,\n      }\n    }\n    if (method === 'detail') {\n      return {\n        ...tracks[1],\n        album: 'VA',\n        label: 'Test',\n        added: '2025-01-01',\n        created: '2024-01-01',\n        path: 'E:/Music/velvet.mp3',\n        comment: '',\n        key_raw: '9A',\n        plays: 1,\n        bitrate: 320,\n        sample_rate: 44100,\n        bytes: 9000000,\n        waveform: [4, 12, 24, 18],\n      }\n    }\n    if (method === 'rekordboxTransport') {\n      const p = (_params ?? {}) as { action?: 'reveal' | 'deck1' | 'deck2'; query?: string; path?: string }\n      const ok = overrides?.transportOk ?? true\n      return {\n        ok,\n        reason: ok ? 'sent' : 'no_window',\n        action: p.action ?? 'reveal',\n        deck: p.action === 'deck1' ? 1 : p.action === 'deck2' ? 2 : null,\n        query: p.query ?? '',\n        path: p.path ?? '',\n        copied: true,\n        message: ok\n          ? `In Rekordbox ausgeführt: ${p.query ?? ''}`\n          : 'Rekordbox ist nicht geöffnet. Suchtext wurde in die Zwischenablage kopiert.',\n      }\n    }\n    return true\n  })\n\n  window.cuepoint = {\n    request: reqSpy as unknown as <"+"T>(method: string, params?: object) => Promise<"+"T>,\n    choose: vi.fn().mockResolvedValue('E:/Backup/Master'),\n    window: vi.fn().mockResolvedValue(undefined),\n    ...(overrides?.omitReveal ? {} : { revealFile: vi.fn().mockResolvedValue(overrides?.revealOk ?? true) }),\n  }\n  return reqSpy\n}\n\ndescribe('App (main.tsx)', () => {\n aterThanOrEqual(6)\n    }, { timeout: 5000 })\n\n    ;(window.cuepoint!.choose as ReturnType<"+"typeof vi.fn>).mockResolvedValue('E:/USB/exportLibrary.db')\n    fireEvent.click(document.querySelector('#liveStatusBtn')!)\n    const hwModal = within(document.querySelector('.modal')! as HTMLElement)\n    for (const label of ['Pro DJ Link verbinden', 'Demo-Link', 'Trennen', /Netze & USB prüfen/, /USB-Datenbank wählen/, 'Lösen']) {\n      await waitFor(() => {\n        const btn = hwModal.queryByText(label)\n        if (btn) expect(btn).not.toBeDisabled()\n      }, { timeout: 2000 })\n      const btn = hwModal.queryByText(label)\n      if (btn) fireEvent.click(btn)\n    }\n    fireEvent.keyDown(window, { key: 'Escape' })\n  }, 60000)\n\n  it('falls back cleanly when localStorage holds non-array values or empty columns', async () => {\n    localStorage.setItem('airdox.setTracks', '{\"not\":\"array\"}')\n    localStorage.setItem('airdox.columns', '[]')\n    localStorage.setItem('airdox.customPresets', '{\"not\":\"array\"}')\n    const reqSpy = makeMockBridge()\n    const { unmount } = render(<"+"App />)\n    await waitFor(() => expect(reqSpy).toHaveBeenCalledWith('open', { path: undefined }))\n    unmount()\n  })\n\n  it('displays and updates the top-left viewport size overlay on resize', async () => {\n    const reqSpy = makeMockBridge()\n    render(<"+"App />)\n    await waitFor(() => expect(reqSpy).toHaveBeenCalledWith('open', { path: undefined }))\n    const indicator = screen.getByTestId('viewport-indicator')\n    expect(indicator.textContent).toBe(`${window.innerWidth} × ${window.innerHeight}`)\n\n    Object.defineProperty(window, 'innerWidth', { writable: true, configurable: true, value: 1440 })\n    Object.defineProperty(window, 'innerHeight', { writable: true, configurable: true, value: 900 })\n    fireEvent(window, new Event('resize'))\n    expect(indicator.textContent).toBe('1440 × 900')\n  })\n})\n"},"tests/frontend/api-metadata.test.ts":{"tests":[{"id":"13","name":"metadata.ts > exposes complete field definitions, operators, camelot keys and presets","location":{"start":{"column":3,"line":32}}},{"id":"14","name":"metadata.ts > loads and saves custom presets safely across valid, invalid and throwing storage","location":{"start":{"column":3,"line":80}}},{"id":"15","name":"metadata.ts > moves array items cleanly and ignores out-of-bounds or no-op moves","location":{"start":{"column":3,"line":114}}},{"id":"16","name":"api.ts > delegates request() to window.cuepoint.request and formats error messages","location":{"start":{"column":3,"line":131}}},{"id":"17","name":"api.ts > formats counters, bpm, durations, filenames and camelot colors","location":{"start":{"column":3,"line":148}}},{"id":"18","name":"api.ts > computes relatedKeys and harmonicTransition accurately including wrap-around 1/12","location":{"start":{"column":3,"line":168}}},{"id":"19","name":"api.ts > exports CSV with BOM, proper quoting, optional nulls and revokes blob URL","location":{"start":{"column":3,"line":183}}},{"id":"20","name":"api.ts > covers rekordboxTransport, revealFile, exportM3u8Playlist and exportRekordboxXml strictly","location":{"start":{"column":3,"line":251}}},{"id":"21","name":"api.ts > covers web bridge fallback when window.cuepoint is absent","location":{"start":{"column":3,"line":429}}}],"source":"import { describe, expect, it, vi } from 'vitest'\nimport {\n  basename,\n  bpmText,\n  camelotColor,\n  count,\n  duration,\n  exportM3u8Playlist,\n  exportRekordboxXml,\n  exportSetCsv,\n  harmonicTransition,\n  message,\n  rekordboxTransport,\n  relatedKeys,\n  request,\n  revealFile,\n  type Track,\n} from '../../src/api'\nimport {\n  builtInPresets,\n  defaultColumns,\n  fields,\n  keys,\n  loadCustomPresets,\n  metadata,\n  move,\n  opsText,\n  saveCustomPresets,\n} from '../../src/metadata'\n\ndescribe('metadata.ts', () => {\n  it('exposes complete field definitions, operators, camelot keys and presets', () => {\n    expect(fields.length).toBe(18)\n    expect(metadata.get('bpm')?.type).toBe('number')\n    expect(metadata.get('key')?.type).toBe('key')\n    expect(defaultColumns).toEqual(['title', 'artist', 'bpm', 'key', 'genre', 'rating'])\n    expect(Object.keys(opsText)).toEqual(['contains', 'eq', 'neq', 'gte', 'lte', 'range', 'empty'])\n    expect(keys).toHaveLength(24)\n    expect(keys[0]).toBe('1A')\n    expect(keys[23]).toBe('12B')\n    expect(opsText).toEqual({\n      contains: 'enthält',\n      eq: 'ist gleich',\n      neq: 'ist nicht',\n      gte: 'mindestens',\n      lte: 'höchstens',\n      range: 'zwischen',\n      empty: 'ist leer',\n    })\n    expect(builtInPresets).toEqual([\n      {\n        id: 'techno',\n        name: 'Techno / Peak',\n        logic: 'AND',\n        groups: [\n          { mode: 'OR', rules: [{ id: 'genre', op: 'eq', value: 'Techno' }, { id: 'genre', op: 'eq', value: 'Hardgroove' }] },\n          { mode: 'AND', rules: [{ id: 'bpm', op: 'range', value: '134..142' }, { id: 'rating', op: 'gte', value: '4' }] },\n        ],\n      },\n      {\n        id: 'warmup',\n        name: 'Melodic Warmup',\n        logic: 'AND',\n        groups: [\n          { mode: 'OR', rules: [{ id: 'genre', op: 'eq', value: 'Melodic House' }, { id: 'genre', op: 'eq', value: 'Deep House' }] },\n          { mode: 'AND', rules: [{ id: 'bpm', op: 'range', value: '118..130' }] },\n        ],\n      },\n      {\n        id: 'unplayed',\n        name: 'Selten gespielt',\n        logic: 'AND',\n        groups: [\n          { mode: 'AND', rules: [{ id: 'plays', op: 'lte', value: '2' }, { id: 'rating', op: 'gte', value: '3' }] },\n        ],\n      },\n    ])\n  })\n\n  it('loads and saves custom presets safely across valid, invalid and throwing storage', () => {\n    expect(loadCustomPresets()).toEqual([])\n\n    localStorage.setItem('airdox.customPresets', JSON.stringify({ not: 'an-array' }))\n    expect(loadCustomPresets()).toEqual([])\n\n    localStorage.setItem(\n      'airdox.customPresets',\n      JSON.stringify([\n        { id: 'c1', name: 'My Peak', logic: 'AND', groups: [] },\n        { id: 123, name: 'Bad Id', groups: [] },\n        { id: 'bad-name-type', name: 999, groups: [] },\n        { id: 'no-name', groups: [] },\n        { id: 'bad-groups', name: 'Valid Name', groups: 'not-an-array' },\n        null,\n      ]),\n    )\n    expect(loadCustomPresets()).toEqual([\n      { id: 'c1', name: 'My Peak', logic: 'AND', groups: [], custom: true },\n    ])\n\n    localStorage.setItem('airdox.customPresets', '{broken-json')\n    expect(loadCustomPresets()).toEqual([])\n\n    saveCustomPresets([{ id: 'c2', name: 'Saved', logic: 'OR', groups: [] }])\n    expect(loadCustomPresets()).toHaveLength(1)\n\n    const spy = vi.spyOn(Storage.prototype, 'setItem').mockImplementation(() => {\n      throw new Error('QuotaExceeded')\n    })\n    expect(() => saveCustomPresets([])).not.toThrow()\n    spy.mockRestore()\n  })\n\n  it('moves array items cleanly and ignores out-of-bounds or no-op moves', () => {\n    const src = ['a', 'b', 'c']\n    expect(move(src, -1, 1)).toBe(src)\n    expect(move(src, 0, -1)).toBe(src)\n    expect(move(src, 5, 1)).toBe(src)\n    expect(move(src, 0, 5)).toBe(src)\n    expect(move(src, 3, 1)).toBe(src)\n    expect(move(src, src.length, 1)).toBe(src)\n    expect(move(src, 0, 3)).toBe(src)\n    expect(move(src, 0, src.length)).toBe(src)\n    expect(move(src, 1, 1)).toBe(src)\n    expect(move(src, 0, 2)).toEqual(['b', 'c', 'a'])\n    expect(move(src, 2, 0)).toEqual(['c', 'a', 'b'])\n  })\n})\n\ndescribe('api.ts', () => {\n  it('delegates request() to window.cuepoint.request and formats error messages', async () => {\n    const reqMock = vi.fn().mockResolvedValue({ ok: true })\n    window.cuepoint = {\n      request: reqMock,\n      choose: vi.fn(),\n      window: vi.fn(),\n    }\n\n    await expect(request('query', { limit: 10 })).resolves.toEqual({ ok: true })\n    expect(reqMock).toHaveBeenCalledWith('query', { limit: 10 })\n\n    expect(message(new Error(\"Error invoking remote method 'cuepoint:request': Error: DB gesperrt\"))).toBe('DB gesperrt')\n    expect(message('Plain error')).toBe('Plain error')\n    const embeddedMsg = \"Log: Error invoking remote method 'foo': Error: inner failure\"\n    expect(message(embeddedMsg)).toBe(embeddedMsg)\n  })\n\n  it('formats counters, bpm, durations, filenames and camelot colors', () => {\n    expect(count(15500)).toBe('15.500')\n    expect(bpmText(138.5)).toBe('138.50')\n    expect(bpmText(null)).toBe('—')\n    expect(duration(null)).toBe('—')\n    expect(duration(65)).toBe('01:05')\n    expect(basename('E:\\\\Music\\\\Set\\\\Track.mp3')).toBe('Track.mp3')\n    expect(basename('/Users/dj/track.wav')).toBe('track.wav')\n    expect(basename(null)).toBe('')\n    const expectedColors = [\n      '#84dfd1', '#9be1b0', '#b9df98', '#d7e491', '#e8d6a0', '#e8bcab',\n      '#e1afd0', '#c9ace8', '#aeb5ed', '#98b9ed', '#83cfec', '#76dce4',\n    ]\n    expectedColors.forEach((color, i) => {\n      expect(camelotColor(`${i + 1}A`)).toBe(color)\n      expect(camelotColor(`${i + 1}B`)).toBe(color)\n    })\n    expect(camelotColor('invalid')).toBe('#a2a6ba')\n  })\n\n  it('computes relatedKeys and harmonicTransition accurately including wrap-around 1/12', () => {\n    expect(relatedKeys('bad')).toEqual([])\n    expect(relatedKeys('8A_invalid')).toEqual([])\n    expect(relatedKeys('invalid_8A')).toEqual([])\n    expect(relatedKeys(' 12a ')).toEqual(['11A', '12A', '1A', '12B'])\n    expect(relatedKeys('1B')).toEqual(['12B', '1B', '2B', '1A'])\n\n    expect(harmonicTransition(null, '8A')).toEqual({ label: 'Tonart fehlt', kind: 'warning' })\n    expect(harmonicTransition('8A', null)).toEqual({ label: 'Tonart fehlt', kind: 'warning' })\n    expect(harmonicTransition('8A', '8A')).toEqual({ label: 'Gleicher Key', kind: 'good' })\n    expect(harmonicTransition('8A', '9A')).toEqual({ label: 'Harmonisch benachbart', kind: 'good' })\n    expect(harmonicTransition('8A', '8B')).toEqual({ label: 'Harmonisch benachbart', kind: 'good' })\n    expect(harmonicTransition('8A', '3B')).toEqual({ label: 'Key-Wechsel prüfen', kind: 'warning' })\n  })\n\n  it('exports CSV with BOM, proper quoting, optional nulls and revokes blob URL', async () => {\n    vi.useFakeTimers()\n    const clickSpy = vi.fn()\n    const createdLinks: HTMLAnchorElement[] = []\n    const createEl = document.createElement.bind(document)\n    const createSpy = vi.spyOn(document, 'createElement').mockImplementation((tag: string) => {\n      const el = createEl(tag)\n      if (tag === 'a') {\n        el.click = clickSpy\n        createdLinks.push(el as HTMLAnchorElement)\n      }\n      return el\n    })\n    const createUrlSpy = vi.spyOn(URL, 'createObjectURL').mockReturnValue('blob:test-csv')\n    const revokeUrlSpy = vi.spyOn(URL, 'revokeObjectURL').mockImplementation(() => {})\n\n    const tracks: Track[] = [\n      {\n        id: '1',\n        title: 'Dark \"Pulse\"',\n        artist: 'Klang',\n        genre: 'Techno',\n        bpm: 138,\n        key: '8A',\n        rating: 5,\n        seconds: 320,\n        year: 2024,\n      },\n      {\n        id: '2',\n        title: 'Ambient Intro',\n        artist: 'Nova',\n        genre: 'Ambient',\n        bpm: null,\n        key: null,\n        rating: 0,\n        seconds: null,\n        year: null,\n      },\n    ]\n\n    const csv = exportSetCsv(tracks)\n    expect(csv).toBe(\n      '\\uFEFF' +\n        [\n          'Nr;Titel;Interpret;BPM;Camelot;Genre;Rating;Jahr;Dauer (s)',\n          '\"1\";\"Dark \"\"Pulse\"\"\";\"Klang\";\"138.00\";\"8A\";\"Techno\";\"5\";\"2024\";\"320\"',\n          '\"2\";\"Ambient Intro\";\"Nova\";\"\";\"\";\"Ambient\";\"0\";\"\";\"\"',\n        ].join('\\r\\n'),\n    )\n    const csvBlob = createUrlSpy.mock.calls[0][0] as Blob\n    expect(csvBlob.type).toBe('text/csv;charset=utf-8')\n    expect(csvBlob.size).toBe(new TextEncoder().encode(csv).length)\n    expect(await csvBlob.text()).toBe(csv.replace(/^\\uFEFF/, ''))\n    expect(createdLinks[0].download).toBe('airdox-setliste.csv')\n    expect(createdLinks[0].href).toBe('blob:test-csv')\n    expect(clickSpy).toHaveBeenCalledTimes(1)\n\n    vi.advanceTimersByTime(1999)\n    expect(revokeUrlSpy).not.toHaveBeenCalled()\n    vi.advanceTimersByTime(1)\n    expect(revokeUrlSpy).toHaveBeenCalledWith('blob:test-csv')\n    createSpy.mockRestore()\n    createUrlSpy.mockRestore()\n    revokeUrlSpy.mockRestore()\n    vi.useRealTimers()\n  })\n\n  it('covers rekordboxTransport, revealFile, exportM3u8Playlist and exportRekordboxXml strictly', async () => {\n    const reqMock = vi.fn().mockResolvedValue({\n      ok: true,\n      reason: 'sent',\n      action: 'deck1',\n      deck: 1,\n      query: 'Pulse Klang',\n      path: 'E:/Music/pulse.mp3',\n      copied: true,\n      message: 'An Deck 1 gesendet',\n    })\n    const revealMock = vi.fn().mockResolvedValueOnce(true).mockResolvedValueOnce(false)\n    window.cuepoint = {\n      request: reqMock,\n      choose: vi.fn(),\n      window: vi.fn(),\n      revealFile: revealMock,\n    }\n\n    await expect(\n      rekordboxTransport({ id: '1', action: 'deck1', query: 'Pulse Klang', path: 'E:/Music/pulse.mp3' }),\n    ).resolves.toEqual({\n      ok: true,\n      reason: 'sent',\n      action: 'deck1',\n      deck: 1,\n      query: 'Pulse Klang',\n      path: 'E:/Music/pulse.mp3',\n      copied: true,\n      message: 'An Deck 1 gesendet',\n    })\n    expect(reqMock).toHaveBeenCalledWith('rekordboxTransport', {\n      id: '1',\n      action: 'deck1',\n      query: 'Pulse Klang',\n      path: 'E:/Music/pulse.mp3',\n    })\n\n    await expect(revealFile('E:/Music/pulse.mp3')).resolves.toBe(true)\n    expect(revealMock).toHaveBeenCalledWith('E:/Music/pulse.mp3')\n    await expect(revealFile('E:/Music/missing.mp3')).resolves.toBe(false)\n    expect(revealMock).toHaveBeenCalledWith('E:/Music/missing.mp3')\n\n    // Missing revealFile fallback\n    window.cuepoint = {\n      request: reqMock,\n      choose: vi.fn(),\n      window: vi.fn(),\n    }\n    await expect(revealFile('E:/Music/pulse.mp3')).resolves.toBe(false)\n\n    // M3U8 & Rekordbox XML exports with strict exact assertions\n    vi.useFakeTimers()\n    const clickSpy = vi.fn()\n    const createdLinks: HTMLAnchorElement[] = []\n    const createEl = document.createElement.bind(document)\n    const createSpy = vi.spyOn(document, 'createElement').mockImplementation((tag: string) => {\n      const el = createEl(tag)\n      if (tag === 'a') {\n        el.click = clickSpy\n        createdLinks.push(el as HTMLAnchorElement)\n      }\n      return el\n    })\n    const createUrlSpy = vi.spyOn(URL, 'createObjectURL').mockReturnValue('blob:test-export')\n    const revokeSpy = vi.spyOn(URL, 'revokeObjectURL').mockImplementation(() => {})\n\n    const tracks: Track[] = [\n      {\n        id: '1',\n        title: \"Dark & <"+"Pulse> 'Mix'\",\n        artist: 'Klang \"A\"',\n        genre: 'Techno & Acid',\n        bpm: 138,\n        key: '8A',\n        rating: 5,\n        seconds: 320,\n        year: 2024,\n        path: 'E:\\\\Music\\\\set & mix.mp3',\n      },\n      {\n        id: '2',\n        title: '',\n        artist: '',\n        genre: 'Ambient',\n        bpm: null,\n        key: null,\n        rating: 0,\n        seconds: null,\n        year: null,\n        path: '/Users/dj/ambient track.wav',\n      },\n      {\n        id: '3',\n        title: 'Zero Seconds',\n        artist: 'Nova',\n        genre: 'House',\n        bpm: 124.5,\n        key: '6A',\n        rating: 3,\n        seconds: 0,\n        year: 2022,\n      },\n    ]\n\n    const m3uDefault = exportM3u8Playlist(tracks)\n    expect(m3uDefault).toBe(\n      [\n        '#EXTM3U',\n        '#EXTINF:320,Klang \"A\" - Dark & <"+"Pulse> \\'Mix\\'',\n        'E:\\\\Music\\\\set & mix.mp3',\n        '#EXTINF:-1,Unbekannt - Ohne Titel',\n        '/Users/dj/ambient track.wav',\n        '#EXTINF:0,Nova - Zero Seconds',\n        'Nova - Zero Seconds',\n      ].join('\\r\\n'),\n    )\n    const m3uBlob = createUrlSpy.mock.calls[0][0] as Blob\n    expect(m3uBlob.type).toBe('audio/x-mpegurl;charset=utf-8')\n    expect(m3uBlob.size).toBeGreaterThan(0)\n    expect(await m3uBlob.text()).toBe(m3uDefault)\n    expect(createdLinks[0].download).toBe('airdox-setliste.m3u8')\n    expect(createdLinks[0].href).toBe('blob:test-export')\n\n    const m3uCustom = exportM3u8Playlist(tracks, 'custom.m3u8')\n    expect(m3uCustom).toBe(m3uDefault)\n    expect(createdLinks[1].download).toBe('custom.m3u8')\n\n    const xmlDefault = exportRekordboxXml(tracks)\n    const parsedXml = new DOMParser().parseFromString(xmlDefault, 'text/xml')\n    expect(parsedXml.querySelector('parsererror')).toBeNull()\n    expect(parsedXml.querySelectorAll('TRACK')).toHaveLength(6) // 3 collection + 3 playlist\n    expect(parsedXml.querySelector('TRACK[TrackID=\"1\"]')?.getAttribute('AverageBpm')).toBe('138.00')\n\n    expect(xmlDefault).toBe(\n      [\n        '<"+"?xml version=\"1.0\" encoding=\"UTF-8\"?>',\n        '<"+"DJ_PLAYLISTS Version=\"1.0.0\">',\n        '  <"+"PRODUCT Name=\"airdox Library\" Version=\"1.1.0\" Company=\"airdox\"/>',\n        '  <"+"COLLECTION Entries=\"3\">',\n        '    <"+"TRACK TrackID=\"1\" Name=\"Dark &amp; &lt;Pulse&gt; &apos;Mix&apos;\" Artist=\"Klang &quot;A&quot;\" Genre=\"Techno &amp; Acid\" TotalTime=\"320\" Year=\"2024\" AverageBpm=\"138.00\" Tonality=\"8A\" Location=\"file://localhost/E:/Music/set%20&amp;%20mix.mp3\"/>',\n        '    <"+"TRACK TrackID=\"2\" Name=\"\" Artist=\"\" Genre=\"Ambient\" TotalTime=\"0\" Year=\"\" AverageBpm=\"\" Tonality=\"\" Location=\"file://localhost/Users/dj/ambient%20track.wav\"/>',\n        '    <"+"TRACK TrackID=\"3\" Name=\"Zero Seconds\" Artist=\"Nova\" Genre=\"House\" TotalTime=\"0\" Year=\"2022\" AverageBpm=\"124.50\" Tonality=\"6A\"/>',\n        '  <"+"/COLLECTION>',\n        '  <"+"PLAYLISTS>',\n        '    <"+"NODE Type=\"0\" Name=\"ROOT\" Count=\"1\">',\n        '      <"+"NODE Name=\"airdox Set\" Type=\"1\" KeyType=\"0\" Entries=\"3\">',\n        '        <"+"TRACK Key=\"1\"/>',\n        '        <"+"TRACK Key=\"2\"/>',\n        '        <"+"TRACK Key=\"3\"/>',\n        '      <"+"/NODE>',\n        '    <"+"/NODE>',\n        '  <"+"/PLAYLISTS>',\n        '<"+"/DJ_PLAYLISTS>',\n      ].join('\\n'),\n    )\n    const xmlBlob = createUrlSpy.mock.calls[2][0] as Blob\n    expect(xmlBlob.type).toBe('application/xml;charset=utf-8')\n    expect(xmlBlob.size).toBeGreaterThan(0)\n    expect(await xmlBlob.text()).toBe(xmlDefault)\n    expect(createdLinks[2].download).toBe('rekordbox-import.xml')\n    expect(createdLinks[2].href).toBe('blob:test-export')\n\n    const xmlCustom = exportRekordboxXml(tracks, \"Peak & 'Set'\", 'peak.xml')\n    expect(xmlCustom).toContain('      <"+"NODE Name=\"Peak &amp; &apos;Set&apos;\" Type=\"1\" KeyType=\"0\" Entries=\"3\">')\n    expect(createdLinks[3].download).toBe('peak.xml')\n    expect(clickSpy).toHaveBeenCalledTimes(4)\n\n    vi.advanceTimersByTime(1999)\n    expect(revokeSpy).not.toHaveBeenCalled()\n    vi.advanceTimersByTime(1)\n    expect(revokeSpy).toHaveBeenCalledWith('blob:test-export')\n    createSpy.mockRestore()\n    createUrlSpy.mockRestore()\n    revokeSpy.mockRestore()\n    vi.useRealTimers()\n  })\n\n  it('covers web bridge fallback when window.cuepoint is absent', async () => {\n    const { chooseFile, windowControl } = await import('../../src/api')\n    const prevCuepoint = window.cuepoint\n    delete (window as { cuepoint?: unknown }).cuepoint\n\n    const fetchMock = vi\n      .fn()\n      .mockResolvedValueOnce({\n        ok: true,\n        status: 200,\n        json: async () => ({ result: { total: 42 } }),\n      })\n      .mockResolvedValueOnce({\n        ok: false,\n        status: 500,\n        json: async () => ({ error: 'Backend offline' }),\n      })\n      .mockResolvedValueOnce({\n        ok: false,\n        status: 502,\n        json: async () => ({}),\n      })\n    vi.stubGlobal('fetch', fetchMock)\n\n    await expect(request<"+"{ total: number }>('demoLibrary')).resolves.toEqual({ total: 42 })\n    expect(fetchMock).toHaveBeenCalledWith('/api/cuepoint/request', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ method: 'demoLibrary', params: {} }),\n    })\n    await expect(request('query', { limit: 10 })).rejects.toThrow('Backend offline')\n    await expect(request('query')).rejects.toThrow('HTTP 502')\n    await expect(chooseFile(false)).resolves.toBeNull()\n    await expect(windowControl('minimize')).resolves.toBeUndefined()\n\n    const winChoose = vi.fn().mockResolvedValue('E:/PIONEER/master.db')\n    const winControl = vi.fn().mockResolvedValue(undefined)\n    window.cuepoint = {\n      request: vi.fn(),\n      choose: winChoose,\n      window: winControl,\n    }\n    await expect(chooseFile(true)).resolves.toBe('E:/PIONEER/master.db')\n    expect(winChoose).toHaveBeenCalledWith(true)\n    await expect(windowControl('maximize')).resolves.toBeUndefined()\n    expect(winControl).toHaveBeenCalledWith('maximize')\n\n    vi.unstubAllGlobals()\n    window.cuepoint = prevCuepoint\n  })\n})\n\n"},"tests/frontend/components-wheel.test.tsx":{"tests":[{"id":"22","name":"components.tsx > renders KeyBadge matched, unmatched and null states","location":{"start":{"column":3,"line":7}}},{"id":"23","name":"components.tsx > clamps Stars between 0 and 5 with accessible label","location":{"start":{"column":3,"line":24}}},{"id":"24","name":"components.tsx > renders deterministic MiniWave and LiveWaveform with sample data and synthetic fallback","location":{"start":{"column":3,"line":35}}},{"id":"25","name":"components.tsx > renders Empty state with default and custom icon","location":{"start":{"column":3,"line":46}}},{"id":"26","name":"components.tsx > handles Modal open/closed, backdrop click, Escape key and button actions","location":{"start":{"column":3,"line":55}}},{"id":"27","name":"camelot-wheel.tsx > renders 24 Camelot segments, handles single/additive clicks, keyboard activation and toggles","location":{"start":{"column":3,"line":117}}}],"source":"import { fireEvent, render, screen } from '@testing-library/react'\nimport { describe, expect, it, vi } from 'vitest'\nimport { CamelotWheel } from '../../src/camelot-wheel'\nimport { Empty, KeyBadge, LiveWaveform, MiniWave, Modal, Stars } from '../../src/components'\n\ndescribe('components.tsx', () => {\n  it('renders KeyBadge matched, unmatched and null states', () => {\n    const { container, rerender } = render(<"+"KeyBadge value={null} reference=\"8A\" />)\n    expect(container.querySelector('.muted')).toHaveTextContent('—')\n\n    rerender(<"+"KeyBadge value=\"8A\" reference=\"9A\" />)\n    const matchBadge = container.querySelector('.keybadge')\n    expect(matchBadge).toHaveTextContent('8A')\n    expect(matchBadge).toHaveClass('match')\n\n    rerender(<"+"KeyBadge value=\"3B\" reference=\"9A\" />)\n    const plainBadge = container.querySelector('.keybadge')\n    expect(plainBadge).not.toHaveClass('match')\n\n    rerender(<"+"KeyBadge value=\"5A\" />)\n    expect(container.querySelector('.keybadge')).not.toHaveClass('match')\n  })\n\n  it('clamps Stars between 0 and 5 with accessible label', () => {\n    const { rerender } = render(<"+"Stars value={7.4} />)\n    expect(screen.getByLabelText('5 von 5 Sternen')).toHaveTextContent('★★★★★')\n\n    rerender(<"+"Stars value={-2} />)\n    expect(screen.getByLabelText('0 von 5 Sternen')).toHaveTextContent('☆☆☆☆☆')\n\n    rerender(<"+"Stars value={3} />)\n    expect(screen.getByLabelText('3 von 5 Sternen')).toHaveTextContent('★★★☆☆')\n  })\n\n  it('renders deterministic MiniWave and LiveWaveform with sample data and synthetic fallback', () => {\n    const { container, rerender } = render(<"+"MiniWave trackId=\"trk-42\" />)\n    expect(container.querySelectorAll('svg.wfmini rect')).toHaveLength(32)\n\n    rerender(<"+"LiveWaveform samples={[0, 5, 18, 31, 12, 24]} seedId=\"trk-42\" />)\n    expect(screen.getByLabelText('Track-Analyse Waveform').querySelectorAll('rect').length).toBeGreaterThan(200)\n\n    rerender(<"+"LiveWaveform samples={[]} seedId=\"\" />)\n    expect(screen.getByLabelText('Track-Analyse Waveform').querySelectorAll('rect').length).toBeGreaterThan(200)\n  })\n\n  it('renders Empty state with default and custom icon', () => {\n    const { rerender } = render(<"+"Empty title=\"Leer\">Beschreibung<"+"/Empty>)\n    expect(screen.getByText('Leer')).toBeInTheDocument()\n    expect(screen.getByText('Beschreibung')).toBeInTheDocument()\n\n    rerender(<"+"Empty icon={<"+"span data-testid=\"custom-icon\">*<"+"/span>} title=\"Custom\" />)\n    expect(screen.getByTestId('custom-icon')).toBeInTheDocument()\n  })\n\n  it('handles Modal open/closed, backdrop click, Escape key and button actions', () => {\n    const onClose = vi.fn()\n    const onSave = vi.fn()\n\n    const { rerender } = render(\n      <"+"Modal\n        open={false}\n        title=\"Dialog\"\n        onClose={onClose}\n        actions={[{ label: 'Schließen' }]}\n      >\n        Inhalt\n      <"+"/Modal>,\n    )\n    expect(screen.queryByRole('dialog')).toBeNull()\n\n    rerender(\n      <"+"Modal\n        open\n        wide\n        title=\"Dialog\"\n        onClose={onClose}\n        actions={[\n          { label: 'Abbrechen' },\n          { label: 'Speichern', primary: true, disabled: false, onClick: onSave },\n        ]}\n      >\n        <"+"div>Inhalt<"+"/div>\n      <"+"/Modal>,\n    )\n\n    const dialog = screen.getByRole('dialog')\n    expect(dialog).toHaveClass('wide')\n\n    // Click inside dialog should NOT close\n    fireEvent.mouseDown(dialog)\n    expect(onClose).not.toHaveBeenCalled()\n\n    // Backdrop mouseDown closes\n    fireEvent.mouseDown(dialog.parentElement!)\n    expect(onClose).toHaveBeenCalledTimes(1)\n\n    // Non-Escape key does not close\n    fireEvent.keyDown(window, { key: 'Enter' })\n    expect(onClose).toHaveBeenCalledTimes(1)\n\n    // Escape closes\n    fireEvent.keyDown(window, { key: 'Escape' })\n    expect(onClose).toHaveBeenCalledTimes(2)\n\n    // Action without onClick falls back to onClose\n    fireEvent.click(screen.getByRole('button', { name: 'Abbrechen' }))\n    expect(onClose).toHaveBeenCalledTimes(3)\n\n    // Action with onClick calls handler without auto-closing\n    fireEvent.click(screen.getByRole('button', { name: 'Speichern' }))\n    expect(onSave).toHaveBeenCalledTimes(1)\n    expect(onClose).toHaveBeenCalledTimes(3)\n  })\n})\n\ndescribe('camelot-wheel.tsx', () => {\n  it('renders 24 Camelot segments, handles single/additive clicks, keyboard activation and toggles', () => {\n    const onToggleKey = vi.fn()\n    const onSelectAllHarmonic = vi.fn()\n    const onAutoFollowChange = vi.fn()\n    const onIncludeCurrentChange = vi.fn()\n\n    const { container, rerender } = render(\n      <"+"CamelotWheel\n        referenceKey=\"8A\"\n        pinned={false}\n        selectedKeys={['8A', '9A', '4B']}\n        autoFollow\n        includeCurrent={false}\n        onToggleKey={onToggleKey}\n        onSelectAllHarmonic={onSelectAllHarmonic}\n        onAutoFollowChange={onAutoFollowChange}\n        onIncludeCurrentChange={onIncludeCurrentChange}\n      />,\n    )\n\n    expect(container.querySelectorAll('g[data-wheel-key]')).toHaveLength(24)\n    expect(screen.getByText('Live-Referenz')).toBeInTheDocument()\n    expect(screen.getByText('8A', { selector: 'text.wheelcentertext' })).toBeInTheDocument()\n    expect(screen.getByText('Aktive Keys: 8A, 9A, 4B')).toBeInTheDocument()\n\n    // SVG geometry checks (kills all pt(), pathWedge(), angles and radius mutants in camelot-wheel.tsx)\n    const allPaths = container.querySelectorAll('.wheel path')\n    expect(allPaths).toHaveLength(24)\n\n    const seg1B = container.querySelector('g[data-wheel-key=\"1B\"]')!\n    const d1B = seg1B.querySelector('path')?.getAttribute('d') ?? ''\n    expect(d1B).toMatch(/^M160\\.\\d+ 9\\.\\d+ A151 151 0 0 1 234\\.\\d+ 28\\.\\d+ L216\\.\\d+ 60\\.\\d+ A114 114 0 0 0 160\\.\\d+ 46\\.\\d+Z$/)\n\n    const seg1A = container.querySelector('g[data-wheel-key=\"1A\"]')!\n    const d1A = seg1A.querySelector('path')?.getAttribute('d') ?? ''\n    expect(d1A).toMatch(/^M160\\.\\d+ 47\\.\\d+ A113 113 0 0 1 215\\.\\d+ 61\\.\\d+ L194\\.\\d+ 99\\.\\d+ A70 70 0 0 0 160\\.\\d+ 90\\.\\d+Z$/)\n\n    const text1B = seg1B.querySelector('text')!\n    expect(Number(text1B.getAttribute('x'))).toBeCloseTo(194.16, 1)\n    expect(Number(text1B.getAttribute('y'))).toBeCloseTo(32.49, 1)\n\n    const text1A = seg1A.querySelector('text')!\n    expect(Number(text1A.getAttribute('x'))).toBeCloseTo(183.55, 1)\n    expect(Number(text1A.getAttribute('y'))).toBeCloseTo(72.10, 1)\n\n    // Segment <"+"title>, aria-label, path styling and class assertions across all 4 states\n    const seg8A = container.querySelector('g[data-wheel-key=\"8A\"]')!\n    expect(seg8A).toHaveAttribute('aria-label', '8A, aktuell, harmonisch kompatibel, als Filter gewählt')\n    expect(seg8A.querySelector('title')?.textContent).toBe(\n      '8A · Aktuelle Referenz · Aktiv im Filter – Klick: nur diesen Key · Strg+Klick: mehrfach wählen',\n    )\n    expect(seg8A.querySelector('path')).toHaveAttribute('fill', '#276eb8')\n    expect(seg8A.querySelector('path')).toHaveAttribute('stroke', '#99c7ff')\n    expect(seg8A.querySelector('path')).toHaveAttribute('stroke-width', '2')\n    expect(seg8A.querySelector('text')).toHaveClass('activekey')\n\n    const seg7A = container.querySelector('g[data-wheel-key=\"7A\"]')!\n    expect(seg7A).toHaveAttribute('aria-label', '7A, harmonisch kompatibel')\n    expect(seg7A.querySelector('title')?.textContent).toBe(\n      '7A · Harmonisch kompatibel – Klick: nur diesen Key · Strg+Klick: mehrfach wählen',\n    )\n    expect(seg7A.querySelector('path')).toHaveAttribute('fill', '#344b60')\n    expect(seg7A.querySelector('path')).toHaveAttribute('stroke', '#4a535d')\n    expect(seg7A.querySelector('path')).toHaveAttribute('stroke-width', '1')\n    expect(seg7A.querySelector('text')).not.toHaveClass('activekey')\n\n    const seg9A = container.querySelector('g[data-wheel-key=\"9A\"]')!\n    expect(seg9A).toHaveAttribute('aria-label', '9A, harmonisch kompatibel, als Filter gewählt')\n    expect(seg9A.querySelector('title')?.textContent).toBe(\n      '9A · Harmonisch kompatibel · Aktiv im Filter – Klick: nur diesen Key · Strg+Klick: mehrfach wählen',\n    )\n    expect(seg9A.querySelector('path')).toHaveAttribute('fill', '#315d83')\n    expect(seg9A.querySelector('path')).toHaveAttribute('stroke', '#618cb5')\n\n    const seg4B = container.querySelector('g[data-wheel-key=\"4B\"]')!\n    expect(seg4B).toHaveAttribute('aria-label', '4B, als Filter gewählt')\n    expect(seg4B.querySelector('title')?.textContent).toBe(\n      '4B · Aktiv im Filter – Klick: nur diesen Key · Strg+Klick: mehrfach wählen',\n    )\n\n    const seg3B = container.querySelector('g[data-wheel-key=\"3B\"]')!\n    expect(seg3B).toHaveAttribute('aria-label', '3B')\n    expect(seg3B.querySelector('title')?.textContent).toBe(\n      '3B – Klick: nur diesen Key · Strg+Klick: mehrfach wählen',\n    )\n    expect(seg3B.querySelector('path')).toHaveAttribute('fill', '#222831')\n    expect(seg3B.querySelector('path')).toHaveAttribute('stroke', '#4a535d')\n\n    const seg3A = container.querySelector('g[data-wheel-key=\"3A\"]')!\n    expect(seg3A.querySelector('path')).toHaveAttribute('fill', '#272e37')\n\n    // Segment click (non-additive vs Ctrl/Shift/Meta-additive)\n    fireEvent.click(seg8A, { ctrlKey: false, shiftKey: false, metaKey: false })\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', false)\n\n    fireEvent.click(seg8A, { ctrlKey: true })\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    fireEvent.click(seg8A, { shiftKey: true })\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    fireEvent.click(seg8A, { metaKey: true })\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    // Keyboard activation: Enter and Space (plain = false with preventDefault)\n    const enterEvt = new KeyboardEvent('keydown', { key: 'Enter', cancelable: true, bubbles: true })\n    const preventEnter = vi.spyOn(enterEvt, 'preventDefault')\n    seg8A.dispatchEvent(enterEvt)\n    expect(preventEnter).toHaveBeenCalled()\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', false)\n\n    const spaceEvt = new KeyboardEvent('keydown', { key: ' ', cancelable: true, bubbles: true })\n    const preventSpace = vi.spyOn(spaceEvt, 'preventDefault')\n    seg8A.dispatchEvent(spaceEvt)\n    expect(preventSpace).toHaveBeenCalled()\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', false)\n\n    // Keyboard activation with modifiers: Ctrl, Shift, Meta\n    const enterShift = new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, cancelable: true, bubbles: true })\n    seg8A.dispatchEvent(enterShift)\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    const enterCtrl = new KeyboardEvent('keydown', { key: 'Enter', ctrlKey: true, cancelable: true, bubbles: true })\n    seg8A.dispatchEvent(enterCtrl)\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    const enterMeta = new KeyboardEvent('keydown', { key: 'Enter', metaKey: true, cancelable: true, bubbles: true })\n    seg8A.dispatchEvent(enterMeta)\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    const spaceCtrl = new KeyboardEvent('keydown', { key: ' ', ctrlKey: true, cancelable: true, bubbles: true })\n    seg8A.dispatchEvent(spaceCtrl)\n    expect(onToggleKey).toHaveBeenLastCalledWith('8A', true)\n\n    // Ignored keys: Tab, Escape, ArrowRight, 'a' (must NOT preventDefault and must NOT trigger onToggleKey)\n    const callCountBefore = onToggleKey.mock.calls.length\n    for (const key of ['Tab', 'Escape', 'ArrowRight', 'a']) {\n      const ignEvt = new KeyboardEvent('keydown', { key, cancelable: true, bubbles: true })\n      const ignPrevent = vi.spyOn(ignEvt, 'preventDefault')\n      seg8A.dispatchEvent(ignEvt)\n      expect(ignPrevent).not.toHaveBeenCalled()\n    }\n    expect(onToggleKey.mock.calls.length).toBe(callCountBefore)\n\n    // Quick chips: title & active/current classes + click\n    const chip8A = container.querySelector('.keychip[data-key=\"8A\"]')!\n    expect(chip8A).toHaveClass('active', 'current')\n    expect(chip8A.className).toBe('keychip active current')\n    expect(chip8A).toHaveAttribute(\n      'title',\n      '8A (aktuelle Tonart) – Klick: einzeln · Strg+Klick: hinzufügen/abwählen',\n    )\n    const chip7A = container.querySelector('.keychip[data-key=\"7A\"]')!\n    expect(chip7A).not.toHaveClass('active')\n    expect(chip7A).not.toHaveClass('current')\n    expect(chip7A.className).toBe('keychip  ')\n    expect(chip7A).toHaveAttribute(\n      'title',\n      '7A (harmonischer Nachbar) – Klick: einzeln · Strg+Klick: hinzufügen/abwählen',\n    )\n    const chip9A = container.querySelector('.keychip[data-key=\"9A\"]')!\n    expect(chip9A).toHaveClass('active')\n    expect(chip9A).not.toHaveClass('current')\n    expect(chip9A.className).toBe('keychip active ')\n    expect(chip9A).toHaveAttribute(\n      'title',\n      '9A (harmonischer Nachbar) – Klick: einzeln · Strg+Klick: hinzufügen/abwählen',\n    )\n    fireEvent.click(chip9A, { ctrlKey: false, shiftKey: false, metaKey: false })\n    expect(onToggleKey).toHaveBeenLastCalledWith('9A', false)\n\n    fireEvent.click(chip9A, { ctrlKey: true })\n    expect(onToggleKey).toHaveBeenLastCalledWith('9A', true)\n\n    fireEvent.click(chip9A, { shiftKey: true })\n    expect(onToggleKey).toHaveBeenLastCalledWith('9A', true)\n\n    fireEvent.click(chip9A, { metaKey: true })\n    expect(onToggleKey).toHaveBeenLastCalledWith('9A', true)\n\n    // All harmonic button & checkboxes + their exact tooltips\n    const allHarmonicBtn = screen.getByRole('button', { name: 'Alle harmonisch passenden Keys wählen' })\n    expect
